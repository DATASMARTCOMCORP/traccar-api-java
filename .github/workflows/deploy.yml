name: Deploy Production (SIR)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Ensaio: envia e confere o pacote na instância, sem parar nem trocar o serviço"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: sir-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/feat/idempotent-position-processing' || inputs.dry_run
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      DEPLOY_SERVICE_NAME: ${{ vars.DEPLOY_SERVICE_NAME }}
      DEPLOY_CONFIG_FILE: ${{ vars.DEPLOY_CONFIG_FILE }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Build and test
        run: ./gradlew clean build --no-daemon --stacktrace
      - name: Validate deployment and rollback
        run: python3 scripts/test-deploy-production.py
      - name: Prepare release and checksums
        run: |
          set -euo pipefail
          mkdir -p release
          cp target/tracker-server.jar release/
          cp -a target/lib schema templates release/
          cd release
          find . -type f -print0 | sort -z | xargs -0 sha256sum > ../SHA256SUMS
          mv ../SHA256SUMS .
      - name: Validate settings
        run: |
          set -euo pipefail
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_PATH DEPLOY_SERVICE_NAME DEPLOY_CONFIG_FILE; do
            test -n "${!name}" || { echo "::error::Missing $name"; exit 1; }
          done
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-zA-Z0-9_-]+$ ]]
          [[ "$DEPLOY_PATH" =~ ^/[a-zA-Z0-9/_-]+$ && "$DEPLOY_PATH" != / ]]
          [[ "$DEPLOY_SERVICE_NAME" =~ ^[a-zA-Z0-9_-]+$ ]]
          [[ "$DEPLOY_CONFIG_FILE" =~ ^[a-zA-Z0-9/_.-]+$ && "$DEPLOY_CONFIG_FILE" != /* && "$DEPLOY_CONFIG_FILE" != *..* ]]
          echo "RELEASE_DIR=/tmp/sir-tracker-deploy-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - name: 🔑 AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      # No SSH: files go through S3 and commands run by SSM Run Command as DEPLOY_USER.
      - name: Check remote deployment tools
        uses: DATASMARTCOMCORP/ci-actions/actions/aws/ssm-deploy@main
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          script_stop: true
          script: |
            for tool in curl python3 flock sha256sum; do
              command -v "$tool" >/dev/null || {
                echo "Missing server prerequisite: $tool. Install it before retrying deployment." >&2
                exit 1
              }
            done
            sudo -n true
      - name: Stage release
        uses: DATASMARTCOMCORP/ci-actions/actions/aws/ssm-deploy@main
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          source: release,scripts/deploy-production.sh
          target: ${{ env.RELEASE_DIR }}
      - name: Verify release
        uses: DATASMARTCOMCORP/ci-actions/actions/aws/ssm-deploy@main
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          envs: RELEASE_DIR
          script_stop: true
          script: |
            cd "$RELEASE_DIR/release"
            sha256sum -c SHA256SUMS --quiet
            echo "Release verified at $RELEASE_DIR"
      - name: Deploy with rollback
        if: ${{ !inputs.dry_run }}
        uses: DATASMARTCOMCORP/ci-actions/actions/aws/ssm-deploy@main
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          envs: RELEASE_DIR,DEPLOY_PATH,DEPLOY_SERVICE_NAME,DEPLOY_CONFIG_FILE,GITHUB_SHA
          script_stop: true
          script: |
            sudo -n bash "$RELEASE_DIR/scripts/deploy-production.sh" "$RELEASE_DIR/release" "$DEPLOY_PATH" "$DEPLOY_SERVICE_NAME" "$DEPLOY_CONFIG_FILE" "$GITHUB_SHA"
      - name: Remove staging files
        if: always() && env.RELEASE_DIR != ''
        continue-on-error: true
        uses: DATASMARTCOMCORP/ci-actions/actions/aws/ssm-deploy@main
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          envs: RELEASE_DIR
          script: |
            rm -rf -- "$RELEASE_DIR"
